            - generic [aria-hidden] [ref=e318]: NZ
            - blockquote [ref=e319]: “Professional, knowledgeable, and genuinely kind. Mojo always takes the time to make sure his customers are happy and goes above and beyond to provide excellent service. I always trust him with my glasses and sunglasses because I know I'm in great hands. Highly recommend!”
          - figure "Review by AH" [ref=e322]:
            - generic [aria-hidden] [ref=e323]: AH
            - blockquote [ref=e324]: “WOW!!!! I just had outstanding service from Mojo at EyeQ. I've been to a few places but this by far is the most thoughtful, informative, honest, and helpful customer service I've received. I didn't feel pressured with being pushed on certain products. Mojo took the time to explain how my lenses work and what to expect. I would highly recommend EyeQ to anyone.”
          - figure "Review by LL" [ref=e327]:
            - generic [aria-hidden] [ref=e328]: LL
            - blockquote [ref=e329]: “I came in to buy a pair of glasses and had an excellent experience. Anees and Honsa were incredibly professional, knowledgeable, and patient throughout the entire process. They took the time to explain all my options, helped me find the perfect pair of glasses, and made sure I was completely comfortable with my choice. Their customer service was outstanding, and they made the whole experience easy and enjoyable. It's rare to find people who genuinely care about helping customers, and Anees and Honsa went above and beyond. I highly recommend them to anyone looking for quality eyewear and exceptional service. Thank you both for the amazing experience!”
          - figure "Review by EP" [ref=e332]:
            - generic [aria-hidden] [ref=e333]: EP
            - blockquote [ref=e334]: “Very professional, knowledgeable and kind staff. Have been a client for many years now, I can only recommend, excellent service.”
