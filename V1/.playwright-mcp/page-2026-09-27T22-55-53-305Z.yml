  - contentinfo [ref=f3e955]:
    - generic [ref=f3e956]:
      - heading "Apple Footer" [level=2] [ref=f3e957]
      - region "Footnotes" [ref=f3e958]:
        - list [ref=f3e959]:
          - listitem [ref=f3e960]:
            - text: "** Apple Card Monthly Installments (ACMI) is a 0% APR payment option that is only available if you select it at checkout in the U.S. for eligible products purchased at Apple Store locations,"
            - link "apple.com" [ref=f3e961] [cursor=pointer]:
              - /url: /
            - text: ", the Apple Store app, or by calling 1‑800‑MY‑APPLE, and is subject to credit approval and credit limit. See"
            - link "here" [ref=f3e962] [cursor=pointer]:
              - /url: https://support.apple.com/102730
            - text: "for more information about eligible products. Existing customers: See your Customer Agreement for your variable APR. As of July 1, 2026, the variable APR on new Apple Card accounts ranges from 17.49% to 27.74%. You must elect to use ACMI at checkout. If you buy an ACMI‑eligible product with a one-time payment on Apple Card at checkout, that purchase is subject to your Apple Card’s variable APR, not the ACMI 0% APR. Taxes and shipping on items purchased using ACMI are subject to your Apple Card’s variable APR, not the ACMI 0% APR. In order to buy an iPhone with ACMI, you must select one of the following carriers (prepaid carrier plans are not supported): AT&T, T‑Mobile, or Verizon. An iPhone purchased with ACMI is always unlocked, so you can switch carriers at any time, subject to your carrier’s terms. ACMI is not available for purchases made at the following special storefronts or when using these discounts in-store at Apple: Apple Employee Purchase Plan; participating corporate Employee Purchase Programs; Apple at Work for small businesses; Government and Veterans and Military Purchase Programs; or on refurbished devices. The last month’s payment for each product will be the product’s purchase price, less all other payments at the monthly payment amount. ACMI is subject to change at any time for any reason, including but not limited to installment term lengths and eligible products. See the"
            - link "Apple Card Customer Agreement" [ref=f3e963] [cursor=pointer]:
              - /url: https://www.goldmansachs.com/terms-and-conditions/Apple-Card-Customer-Agreement.pdf
            - text: for more information about ACMI.
            - paragraph [ref=f3e964]: To access and use all Apple Card features and products available only to Apple Card users, you must add Apple Card to Wallet on an iPhone or iPad that supports and has the latest version of iOS or iPadOS. Apple Card is subject to credit approval, available only for qualifying applicants in the United States, and issued by Goldman Sachs Bank USA, Salt Lake City Branch.
            - paragraph [ref=f3e965]: Apple Payments Services LLC, a subsidiary of Apple Inc., is a service provider of Goldman Sachs Bank USA for Apple Card and Savings accounts. Neither Apple Inc. nor Apple Payments Services LLC is a bank.
            - paragraph [ref=f3e966]: All communications from Apple and Goldman Sachs Bank USA about Apple Card (including transactional and marketing communications) and customer service support are available in English. Certain communications about Apple Card can be viewed in another language depending on your device language settings. If you reside in the U.S. Virgin Islands, American Samoa, Guam, Northern Mariana Islands, or U.S. Minor Outlying Islands, please call Goldman Sachs at 877-255-5923 with questions about Apple Card.
        - list [ref=f3e967]:
          - listitem [ref=f3e968]: 2x more Active Noise Cancellation compared with AirPods Pro 2. World's best Active Noise Cancellation evaluation tested in July 2025 in accordance with IEC 60268-24 as compared with best-selling commercially available wireless in-ear headphones.
          - listitem [ref=f3e969]: Compared with AirPods Pro 2.
          - listitem [ref=f3e970]: Testing conducted by Apple in July and August 2025 using preproduction AirPods Pro 3 with MagSafe Charging Case paired with preproduction iPhone 17 Pro units, all with prerelease software. The playlist consisted of 358 unique audio tracks purchased from the iTunes Store (256-Kbps AAC encoding). Listening time was up to 8 hours when volume was set to 50% and Active Noise Cancellation was enabled. With Spatial Audio and Head Tracking enabled, listening time was up to 7.5 hours. Testing consisted of full AirPods Pro battery discharge while playing audio until the first AirPod Pro stopped playback. Battery life depends on device settings, environment, usage, and many other factors.
          - listitem [ref=f3e971]: Compatible hardware and software required. Works with compatible content in supported apps. Not all content available in Dolby Atmos. iPhone with TrueDepth camera required to create a personal profile for Personalized Spatial Audio, which will sync across Apple devices running the latest operating system software, including iOS, iPadOS, macOS, and tvOS. Personalized Spatial Audio is not available when using other devices.
          - listitem [ref=f3e972]:
            - text: Built-in heart rate monitor is intended for use during workouts with the Fitness app and compatible third-party apps on iPhone running iOS 26 and later. Refer to
            - link "support.apple.com/123184" [ref=f3e973] [cursor=pointer]:
              - /url: https://support.apple.com/123184
            - text: for more information.
          - listitem [ref=f3e974]:
            - text: Available on compatible Apple devices with the latest operating system software when paired with compatible AirPods with the latest firmware when Apple Intelligence is turned on. Available in beta. Some features may not be available in all regions or languages; for more information, see
            - link "Feature Availability" [ref=f3e975] [cursor=pointer]:
              - /url: /ios/feature-availability/#apple-intelligence-live-translation-with-airpods
            - text: .
          - listitem [ref=f3e976]: The Hearing Aid feature has received FDA authorization. The Hearing Test and Hearing Aid features are supported on AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone or iPad with iOS 18 or iPadOS 18 and later and are intended for people 18 years old or older. The Hearing Aid feature is also supported on a compatible Mac with macOS Sequoia and later. It is intended for people with perceived mild to moderate hearing loss.
          - listitem [ref=f3e977]:
            - text: Supported on AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone running iOS 26 and later. This feature may not be available in all regions or all languages.
            - link "View complete list" [ref=f3e978] [cursor=pointer]:
              - /url: /airpods-pro/feature-availability/
            - text: .
          - listitem [ref=f3e979]: 67% more battery life compared with AirPods Pro 2. Testing conducted by Apple in July and August 2025 using preproduction AirPods Pro 3 with MagSafe Charging Case paired with preproduction iPhone 17 Pro units, all with prerelease software. Both volume and amplification level were set to 50% and Transparency was enabled. Testing consisted of full AirPods Pro battery discharge with the Hearing Aid feature on, with no audio playing back from iPhone, until the first AirPod Pro was fully discharged. Battery life depends on device settings, environment, usage, and many other factors.
          - listitem [ref=f3e980]:
            - text: AirPods Pro 3 are dust, sweat, and water resistant for non-water sports and exercise. Products including charging case were tested under controlled laboratory conditions, and have a rating of IP57 under IEC standard 60529. Dust, sweat, and water resistance are not permanent conditions and resistance might decrease as a result of normal wear. Do not attempt to charge when wet; refer to
            - link "support.apple.com/kb/HT210711" [ref=f3e981] [cursor=pointer]:
              - /url: https://support.apple.com/kb/HT210711
            - text: for cleaning and drying instructions.
          - listitem [ref=f3e982]: Available on compatible devices running iOS 26 or iPadOS 26 and later when paired with AirPods 4, AirPods 4 with Active Noise Cancellation, or AirPods Pro 2 and later.
          - listitem [ref=f3e983]:
            - text: Compared with AirPods Pro 2. Expanded Precision Finding works with AirPods Pro 3 paired with iPhone Air or iPhone 15 or later (excluding iPhone 16e); availability varies by region. Visit
            - link "apple.com/uwb" [ref=f3e984] [cursor=pointer]:
              - /url: /uwb
            - text: for more information.
          - listitem [ref=f3e985]: Testing conducted by Apple in July 2025 using AirPods Pro 3 paired with iPhone 16 with prerelease AirPods firmware and iOS 26. Noise reduction was tested in accordance with IEC 60268-24. Comparison made against the best-selling wireless in-ear headphones commercially available at the time of testing. Performance depends on device settings, environment, and many other factors.
          - listitem [ref=f3e986]: Up to 4x more Active Noise Cancellation compared with original AirPods Pro and AirPods 4 with Active Noise Cancellation when tested in accordance with IEC 60268-24.
          - listitem [ref=f3e987]: Requires a compatible Apple device running the latest operating system software.
          - listitem [ref=f3e988]:
            - text: Requires a paired Apple Intelligence–enabled iPhone and Bluetooth headphones with device and Siri language set to English or Spanish. To use Workout Buddy through your Apple Watch without your iPhone nearby, your Apple Watch must have a Wi-Fi or cellular connection. Some features may not be available in all regions or languages. For feature and language availability and system requirements see
            - link "support.apple.com/121115" [ref=f3e989] [cursor=pointer]:
              - /url: https://support.apple.com/121115?cid=general-airpods-b3d8fc66-62028090
            - text: .
          - listitem [ref=f3e990]:
            - text: The Hearing Protection feature works with AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone, iPad, or Mac with iOS 18, iPadOS 18, or macOS Sequoia and later. The feature is not available in all regions or all languages.
            - link "View complete list" [ref=f3e991] [cursor=pointer]:
              - /url: /airpods-pro/feature-availability/
            - text: . See
            - link "support.apple.com/120850" [ref=f3e992] [cursor=pointer]:
              - /url: https://support.apple.com/en-us/120850
            - text: for total attenuation and more information. The Hearing Protection feature is not suitable for protection against extremely loud impulse sounds, such as gunfire, fireworks, or jackhammers, or against sustained sounds louder than 110 dBA.
          - listitem [ref=f3e993]:
            - text: Apple Intelligence is available with Siri and device language set to Chinese (Simplified), Chinese (Traditional), Danish, Dutch, English, French, German, Italian, Japanese, Korean, Norwegian, Portuguese, Spanish, Swedish, Turkish, or Vietnamese. Some features may not be available in all regions or languages. Some devices may not be available in all regions. Siri AI is available in beta in iOS 27, macOS 27, and watchOS 27 and requires an Apple Intelligence–enabled device set to a supported language. Available in English to start. Siri AI will not be initially available in the EU on iOS, iPadOS, and watchOS. Certain Apple Intelligence features that rely on server-side models are subject to daily usage limits, including but not limited to Siri AI, Intelligent Photo Editing Tools, Image Playground, and AFM 3 Cloud models in Shortcuts. Daily limits may vary by feature, request complexity, system demand, system policies, and other factors. Expanded access to such features will be available for a fee in the future. Use of these features is subject to the Apple Intelligence Terms and Conditions. Learn more at
            - link "apple.com/apple-intelligence" [ref=f3e994] [cursor=pointer]:
              - /url: /apple-intelligence/
            - text: . Hands-free access to Siri AI works on all AirPods.
          - listitem [ref=f3e995]: Requires an Apple Account and a compatible Apple device running the latest operating system software.
          - listitem [ref=f3e996]: Siri and activating with just “Siri” may not be available in all languages or in all areas, and features may vary by area. Compatible device and internet access required. Cellular data charges may apply. Activating with just “Siri” is not available on AirPods with the H1 headphone chip and Intel-based Mac computers. Devices must support and have the latest operating system software.
          - listitem [ref=f3e997]: MagSafe charging requires a compatible MagSafe charger. Wireless charging requires a Qi-certified wireless charger. AirPods Pro 3 and AirPods Pro 2 charging case also works with the Apple Watch charger or USB-C connector.
          - listitem [ref=f3e998]: Up to 3x more Active Noise Cancellation compared with AirPods 5 when tested in accordance with IEC 60268-24.
          - listitem [ref=f3e999]:
            - text: Device performance and noise control features like Active Noise Cancellation, Adaptive Audio, and Transparency can be affected by debris or earwax buildup. Clean the device regularly to maintain performance and full feature functionality. Refer to
            - link "support.apple.com/102672" [ref=f3e1000] [cursor=pointer]:
              - /url: https://support.apple.com/102672
            - text: for AirPods 4 cleaning instructions. Refer to
            - link "support.apple.com/120409" [ref=f3e1001] [cursor=pointer]:
              - /url: https://support.apple.com/120409
            - text: for AirPods Pro cleaning instructions.
          - listitem [ref=f3e1002]: Available on compatible devices running iOS 18, iPadOS 18, or macOS Sequoia and later when paired with AirPods 4, AirPods 4 with Active Noise Cancellation, or AirPods Pro 2 and later with the latest firmware. For the best performance, update to the latest software.
          - listitem [ref=f3e1003]: Siri may not be available in all languages or in all areas, and features may vary by area. Compatible device and internet access required. Cellular data charges may apply.
          - listitem [ref=f3e1004]: Available on compatible devices running iOS 18, iPadOS 18, or macOS Sequoia and later when paired with AirPods 4, AirPods 4 with Active Noise Cancellation, or AirPods Pro 2 and later with the latest firmware.
          - listitem [ref=f3e1005]: Up to 1.5x more Active Noise Cancellation compared with AirPods 4 with Active Noise Cancellation when tested in accordance with IEC 60268-24.
          - listitem [ref=f3e1006]: Testing conducted by Apple in July and August 2026 using preproduction AirPods 5 with Wireless Charging Case paired with preproduction iPhone 18 Pro units, all with prerelease software. The playlist consisted of 358 unique audio tracks purchased from the iTunes Store (256-Kbps AAC encoding). Volume was set to 50%, Spatial Audio and Conversation Awareness were off, and Noise Control was set to Active Noise Cancellation. With Noise Control turned off, listening time was up to 7 hours. Testing consisted of full AirPods battery discharge while playing audio until the first AirPod stopped playback. Battery life depends on device settings, environment, usage, and many other factors.
